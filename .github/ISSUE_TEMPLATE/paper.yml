name: Suggest a paper
description: Propose a relevant paper with a primary source.
title: "[Paper] "
body:
  - type: input
    id: title
    attributes:
      label: Exact paper title
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Primary paper URL
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Relevance and suggested collection
      description: Explain which computation or generation decision changes.
    validations:
      required: true
  - type: textarea
    id: publication
    attributes:
      label: Publication and code sources
      description: State preprint status if applicable. Identify the source of any code association.
